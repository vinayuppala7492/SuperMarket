<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - SuperMarket</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-shopping-basket"></i> SuperMarket</div>
    <nav>
      <ul>
        <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>
      </ul>
    </nav>
  </header>

  <section class="checkout">
    <h2>Checkout</h2>
    <div class="checkout-container">
      <!-- Order Summary Section -->
      <div class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-table">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="order-items">
              <!-- Items will be dynamically added here -->
            </tbody>
            <tfoot>
              <tr class="subtotal">
                <td colspan="3">Subtotal</td>
                <td>₹<span id="subtotal">0.00</span></td>
              </tr>
              <tr class="delivery">
                <td colspan="3">Delivery Fee</td>
                <td>₹40.00</td>
              </tr>
              <tr class="total">
                <td colspan="3">Total</td>
                <td>₹<span id="total">0.00</span></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
      
      <div class="checkout-form">
        <h3>Delivery Information</h3>
        <form id="delivery-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label for="address">Delivery Address</label>
            <input type="text" id="address" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="payment">Payment Method</label>
            <div class="payment-input-group">
              <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="credit">Credit Card</option>
                <option value="debit">Debit Card</option>
                <option value="upi">UPI Payment</option>
                <option value="cash">Cash on Delivery</option>
              </select>
              <button type="button" id="payment-voice-control" class="voice-control-btn">
                <i class="fas fa-microphone"></i>
              </button>
            </div>
          </div>

          <!-- Credit/Debit Card Details Form -->
          <div id="card-details" class="form-group payment-details" style="display: none;">
            <div class="card-input">
              <label for="card-number">Card Number</label>
              <input type="text" id="card-number" maxlength="16" placeholder="1234 5678 9012 3456">
            </div>
            <div class="card-row">
              <div class="card-input">
                <label for="expiry">Expiry Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
              </div>
              <div class="card-input">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" maxlength="3" placeholder="123">
              </div>
            </div>
            <div class="card-input">
              <label for="card-name">Name on Card</label>
              <input type="text" id="card-name" placeholder="John Doe">
            </div>
          </div>

          <!-- UPI Payment Form -->
          <div id="upi-details" class="form-group payment-details" style="display: none;">
            <div class="upi-input">
              <label for="upi-id">UPI ID</label>
              <input type="text" id="upi-id" placeholder="username@upi">
            </div>
          </div>

          <button type="submit" class="checkout-btn">Place Order</button>
        </form>
      </div>
    </div>
  </section>

  <script src="checkout.js"></script>
</body>
</html>
